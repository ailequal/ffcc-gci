# CI and release.
#
# Every push to main and every pull request is checked: vet, tests,
# formatting, lint and the changelog format.
#
# A push to main is also a release when CHANGELOG.md has a new version, that
# is, when the newest "## [X.Y.Z] - YYYY-MM-DD" section has no vX.Y.Z tag
# yet. The workflow then builds the archives with "just dist", smoke-tests
# every binary on its own platform, attests their build provenance and
# publishes a GitHub release whose notes come from CHANGELOG.md. Publishing
# the release creates the vX.Y.Z tag on the pushed commit.
#
# So a release is one commit: move the entries of "## [Unreleased]" into a
# new version section and push it to main.
name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No token permissions by default; each job asks only for what it needs.
permissions: {}

env:
  # The just release the recipes are run with: https://just.systems
  JUST_VERSION: "1.59.0"

# One run at a time per branch, so two pushes cannot release the same
# version twice. A newer push to a pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release decision needs the tags
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release builds start from a clean cache

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      # The menu is also tested in a real terminal, which is a tmux session.
      - name: Install tmux
        run: command -v tmux || { sudo apt-get update && sudo apt-get install --yes tmux; }

      - name: Vet, test, and check the formatting and the changelog
        env:
          FFCC_GCI_E2E: require # fail, rather than skip, without tmux
        run: just check

      - name: Lint
        run: just lint-docker

      - name: Decide whether this push is a release
        id: plan
        env:
          # Expressions go through env, never straight into run scripts.
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          version=$(sh scripts/changelog.sh latest)
          release=false
          if [ -z "$version" ]; then
            echo "CHANGELOG.md has no released version yet: nothing to release."
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: nothing to release."
          elif [ "$EVENT" = pull_request ] || [ "$REF" != refs/heads/main ]; then
            echo "v$version is not tagged yet: it is released when this reaches main."
          else
            echo "v$version is new: it will be tagged and released."
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check that the version has release notes
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: sh scripts/changelog.sh notes "${TAG#v}"

      - name: Build the archives
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: just version="$TAG" dist

      - name: Check the version stamped into the binaries
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          tar -xzf "dist/ffcc-gci-$TAG-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/ffcc-gci-$TAG-linux-amd64/ffcc-gci" version | grep -q "^ffcc-gci $TAG ("

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.release == 'true'
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-amd64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: windows-amd64, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Verify the checksum, unpack and run the binary
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cd dist
          name="ffcc-gci-$TAG-$TARGET"
          case "$TARGET" in
            windows-*) archive="$name.zip"; bin="$name/ffcc-gci.exe" ;;
            *) archive="$name.tar.gz"; bin="$name/ffcc-gci" ;;
          esac

          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          grep " $archive\$" SHA256SUMS | $sum -c -

          case "$archive" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath ." ;;
            *) tar -xzf "$archive" ;;
          esac

          version=$("./$bin" version)
          echo "$version"
          [[ $version == "ffcc-gci $TAG ("*", ${TARGET/-//})" ]] || { echo "::error::unexpected version line"; exit 1; }

          # The help, the limits and the item table are built into the binary.
          "./$bin" help >/dev/null
          limits=$("./$bin" limits)
          [[ $limits == *"gil: 0 to 99999999"* ]] || { echo "::error::unexpected limits"; exit 1; }
          items=$("./$bin" items mythril)
          [[ $items == *"296  Mythril"* ]] || { echo "::error::unexpected item list"; exit 1; }

          # A save that does not exist must fail with exit code 1 and a message.
          set +e
          out=$("./$bin" info no-such-save.gci 2>&1)
          code=$?
          set -e
          echo "$out"
          [[ $code -eq 1 && $out == "ffcc-gci: "* ]] || { echo "::error::unexpected result ($code)"; exit 1; }

          # The menu needs a terminal, which a workflow does not have: it
          # must say so and fail, not wait for keys.
          set +e
          out=$("./$bin" menu 2>&1 </dev/null)
          code=$?
          set -e
          echo "$out"
          [[ $code -eq 1 && $out == *"in a terminal"* ]] || { echo "::error::unexpected result ($code)"; exit 1; }

  release:
    name: Publish the release
    needs: [check, smoke]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release, its tag, and upload the archives
      id-token: write # sign the attestations through Sigstore
      attestations: write # store the attestations
      artifact-metadata: write # record the attested artifacts
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Attest the build provenance of the archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          sh scripts/changelog.sh notes "${TAG#v}" > "$notes"
          cat >> "$notes" <<EOF

          ### Downloads

          | System | Archive |
          | --- | --- |
          | Linux (x86-64) | \`ffcc-gci-$TAG-linux-amd64.tar.gz\` |
          | Linux (ARM64) | \`ffcc-gci-$TAG-linux-arm64.tar.gz\` |
          | macOS (Apple Silicon) | \`ffcc-gci-$TAG-darwin-arm64.tar.gz\` |
          | macOS (Intel) | \`ffcc-gci-$TAG-darwin-amd64.tar.gz\` |
          | Windows (x86-64) | \`ffcc-gci-$TAG-windows-amd64.zip\` |
          | Windows (ARM64) | \`ffcc-gci-$TAG-windows-arm64.zip\` |

          Each archive holds the \`ffcc-gci\` binary, the README, the usage reference, the changelog and the license. Unpack it and run \`ffcc-gci help\`.

          The binaries are not signed by Apple or Microsoft: on macOS run \`xattr -d com.apple.quarantine ffcc-gci\` once (or right-click it and choose Open); on Windows choose **More info, Run anyway** in the SmartScreen prompt.

          Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`) and its build provenance with \`gh attestation verify <archive> --repo $REPO\`.
          EOF
          cat "$notes"

      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
